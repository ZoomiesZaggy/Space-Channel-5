name: Transfer validated desktop packages
on:
  workflow_dispatch:
    inputs:
      modules_run_id:
        description: Successful desktop build run to publish
        required: true
        default: '35258152460'
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ZoomiesZaggy/Space-Channel-5
      BUILD_RUN_ID: ${{ inputs.modules_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for all four platform checks
        run: gh run watch "$BUILD_RUN_ID" --exit-status --interval 60
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.modules_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify packages and upload to the unpublished release
        run: python3 tools/transfer_release_artifacts.py
