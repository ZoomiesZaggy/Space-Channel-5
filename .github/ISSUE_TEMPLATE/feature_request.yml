name: Feature request
description: Suggest an improvement to the port.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Explain the player or developer need.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Describe the result you would like and any relevant alternatives.
    validations:
      required: true
